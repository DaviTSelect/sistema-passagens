name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt
          python -m pip install pytest
        shell: pwsh
      - name: Validar tag vs __version__
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PYTHONPATH: src
        run: |
          python -c "
          import os, sys
          from passagem.version import __version__
          tag = os.environ['RELEASE_TAG']
          if tag != 'v' + __version__:
              print(f'ERRO: tag={tag} mas __version__={__version__}', file=sys.stderr)
              sys.exit(1)
          print(f'OK: tag={tag} confere com __version__={__version__}')
          "
        shell: python
      - name: Executar testes
        env:
          PYTHONPATH: src
        run: python -m pytest tests -q
      - name: Build
        shell: pwsh
        run: .\scripts\build.ps1 -OutputDir dist
      - uses: actions/upload-artifact@v4
        with:
          name: sistema-passagens-Windows
          path: dist\sistema-passagens.exe
          if-no-files-found: error
      - name: Criar draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create $env:RELEASE_TAG dist\sistema-passagens.exe --draft --verify-tag --title $env:RELEASE_TAG --generate-notes
